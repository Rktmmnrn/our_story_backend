services:
  - type: web
    name: notre-histoire-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: notre-histoire-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 30
      - key: MEDIA_ROOT
        value: /app/media
      - key: MAX_PHOTO_SIZE_MB
        value: 20
      - key: MAX_VIDEO_SIZE_MB
        value: 500
      - key: MAX_AUDIO_SIZE_MB
        value: 50
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://notre-histoire.vercel.app
      - key: FRONTEND_BASE_URL
        value: https://notre-histoire.vercel.app
      - key: FIRST_ADMIN_EMAIL
        sync: false
      - key: FIRST_ADMIN_PASSWORD
        sync: false
      # SMTP — laisser vides si non configuré (voir fix ci-dessous)
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: rfanomezaniavo@gmail.com
      # Postgres credentials (pour Alembic sync)
      - key: POSTGRES_USER
        fromDatabase:
          name: notre-histoire-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: notre-histoire-db
          property: password
      - key: POSTGRES_DB
        fromDatabase:
          name: notre-histoire-db
          property: database

databases:
  - name: notre-histoire-db
    plan: free
    databaseName: notre_histoire
    user: userNH